version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reclaim-postgres
    environment:
      POSTGRES_DB: reclaim
      POSTGRES_USER: reclaim
      POSTGRES_PASSWORD: reclaim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaim -d reclaim"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reclaim-backend
    environment:
      DATABASE_URL: postgresql://reclaim:reclaim@postgres:5432/reclaim
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: >
      sh -c "python -m scripts.train_classifier 2>/dev/null || true &&
             python -m app.db.seed --force &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reclaim-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
